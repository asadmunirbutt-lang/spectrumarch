name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 11 * * *"   # daily, 7am Eastern: publishes blog posts whose date has arrived
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment token is configured
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the AZURE_STATIC_WEB_APPS_API_TOKEN secret (Settings > Secrets and variables > Actions) before deploying."
            exit 1
          fi

      - name: Build pages and blog
        run: python3 tools/build.py

      # Publish only the public site files, never README.md, deploy.sh, or workflow files.
      - name: Stage public files
        run: |
          mkdir _site
          cp -R *.html *.txt favicon.svg favicon.ico sitemap.xml staticwebapp.config.json assets blog _site/

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true

      # Tell Bing (and Yahoo, DuckDuckGo, Yandex, Seznam via IndexNow) about new or changed pages.
      # Push: every URL in the sitemap. Daily schedule: only URLs whose lastmod is today (newly published posts).
      - name: Notify search engines (IndexNow)
        if: success()
        continue-on-error: true
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, datetime, urllib.request
          key = "57aacd23a77b6e732b0761a37d19b7ff"
          sm = open("sitemap.xml").read()
          entries = re.findall(r"<loc>(.*?)</loc><lastmod>(.*?)</lastmod>", sm)
          today = datetime.date.today().isoformat()
          urls = [u for u, d in entries] if os.environ["EVENT"] != "schedule" else [u for u, d in entries if d == today]
          if not urls:
              print("No new URLs to submit."); raise SystemExit
          body = json.dumps({"host": "www.spectrumarch.org", "key": key,
                             "keyLocation": f"https://www.spectrumarch.org/{key}.txt", "urlList": urls}).encode()
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          with urllib.request.urlopen(req, timeout=30) as r:
              print("IndexNow:", r.status, "submitted", len(urls), "URLs")
          PY
