name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deployment token is configured
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Add the AZURE_STATIC_WEB_APPS_API_TOKEN secret (Settings > Secrets and variables > Actions) before deploying."
            exit 1
          fi

      # Publish only the public site files, never README.md, deploy.sh, or workflow files.
      - name: Stage public files
        run: |
          mkdir _site
          cp -R *.html favicon.svg robots.txt sitemap.xml staticwebapp.config.json assets _site/

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: _site
          skip_app_build: true
